name: Deploy static site to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site and download artist portraits
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/assets
          cp index.html photo1.txt site/
          curl -fL --retry 3 --retry-delay 2 "https://www.artda.cn/attachment/image/221221/56.jpg" -o site/assets/highest.jpg
          curl -fL --retry 3 --retry-delay 2 "https://www.artda.cn/attachment/image/221221/382.jpg" -o site/assets/situ.jpg
          curl -fL --retry 3 --retry-delay 2 "https://www.artda.cn/attachment/image/221221/312.jpg" -o site/assets/lu-desheng.jpg
          test -s site/assets/highest.jpg
          test -s site/assets/situ.jpg
          test -s site/assets/lu-desheng.jpg
          file site/assets/*.jpg

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
